<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f6f9;
}

.header{
    background:#0c3c60;
    color:white;
    padding:20px;
}

.navbar{
    background:#082a44;
    padding:15px;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-right:20px;
    font-weight:bold;
}

.container{
    width:95%;
    margin:auto;
    padding:30px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.card h2{
    color:#0c3c60;
    font-size:36px;
}

.report-section{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:30px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#0c3c60;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.print-btn{
    background:#0c3c60;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.print-btn:hover{
    background:#14527f;
}

@media print{
    .navbar,
    .print-btn{
        display:none;
    }
}

</style>

</head>

<body>

<div class="header">
    <h1>System Reports</h1>
    <p>Administrative Reporting Dashboard</p>
</div>

<div class="navbar">

<a href="admin - dashboard.html">Dashboard</a>
<a href="admin - manage_customers.html">Customers</a>
<a href="admin - manage_bookings.html">Bookings</a>
<a href="admin - manage_staff.html">Staff</a>
<a href="admin - reports.html">Reports</a>
<a href="login.html">Logout</a>

</div>

<div class="container">

<button class="print-btn" onclick="window.print()">
Print Report
</button>

<br><br>

<div class="stats">

<div class="card">
<h2></h2>
<p>Total Customers</p>
</div>

<div class="card">
<h2></h2>
<p>Total Bookings</p>
</div>

<div class="card">
<h2></h2>
<p>Total Staff</p>
</div>

<div class="card">
<h2>R</h2>
<p>Total Revenue</p>
</div>

</div>

<!-- ================= SERVICE REPORT ================= -->

<div class="report-section">

<h2>Service Popularity Report</h2>

<br>

<table>

<tr>
<th>Service</th>
<th>Total Bookings</th>
</tr>


        <tr>
            <td></td>
            <td></td>
        </tr>
 



<tr>
    <td colspan="2">No data available</td>
</tr>



</table>

</div>

<!-- ================= STATUS REPORT ================= -->

<div class="report-section">

<h2>Booking Status Report</h2>

<br>

<table>

<tr>
<th>Status</th>
<th>Total</th>
</tr>


        <tr>
            <td></td>
            <td></td>
        </tr>




<tr>
    <td colspan="2">No data available</td>
</tr>



</table>

</div>

</div>

</body>
</html>
