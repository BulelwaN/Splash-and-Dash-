<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Change Password - Splash &amp; Dash</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body class="auth-page">

    <!--
        Used by BOTH roles: shown automatically after a first login with a temporary password,
        and from "Change Password" in the staff and admin header.

        Backend: check the current password, then save the new one (minimum 8 characters, the same rule as
        the customer API) and set MustChangePassword = false. Then go to the dashboard for the user's role.
    -->

    <main class="auth-container">
        <div class="auth-card">
            <h1>Set a New Password</h1>
            <p>Choose a password that only you know.</p>

            <p class="form-hint">
                If this is your first login you are using a temporary password. Please change it now.
            </p>

            <div class="error-message" hidden>
                <!-- Backend: error message, e.g. "Current password is incorrect." -->
            </div>

            <form method="POST">

                <div class="form-group">
                    <label for="current-password">Current (or temporary) password</label>
                    <input
                        type="password"
                        id="current-password"
                        name="current_password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>

                <button type="submit" name="change_password">Save Password</button>

            </form>

            <a class="back-link" href="javascript:history.back()">Go back</a>
        </div>
    </main>

</body>
</html>
