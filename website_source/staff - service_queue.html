
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Queue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="staff-header">
        <h1>Service Queue</h1>
        <p>Welcome, <span id="staffName"><!-- Backend: Display logged-in staff member's name --></span></p>
    </header>

    <nav class="staff-navbar">
        <a href="staff - dashboard.html">Dashboard</a>
        <a href="login.html">Logout</a>
    </nav>

    <main class="staff-container">

        <section class="queue-section">
            <h2>Bookings</h2>
            <p>View and manage customer bookings from the shared service queue.</p>

            <form method="GET" action="">
                <label for="searchBooking">Search Bookings:</label>
                <input
                    type="text"
                    id="searchBooking"
                    name="search"
                    placeholder="Search by booking ID, customer or registration"
                >

                <label for="statusFilter">Filter by Status:</label>
                <select id="statusFilter" name="status">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <button type="submit">Search</button>
            </form>

            <div class="table-container">
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Customer</th>
                            <th>Contact Number</th>
                            <th>Vehicle</th>
                            <th>Registration</th>
                            <th>Service</th>
                            <th>Booking Type</th>
                            <th>Service Address</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="bookingQueue">

                        <!-- Backend: Display bookings from the shared queue -->

                        <tr>
                            <td><!-- Booking ID --></td>
                            <td><!-- Customer name --></td>
                            <td><!-- Customer phone number (read-only) --></td>
                            <td><!-- Vehicle --></td>
                            <td><!-- Registration --></td>
                            <td><!-- Service --></td>
                            <td><!-- At Location / House Call --></td>
                            <td><!-- House Call address, if applicable --></td>
                            <td><!-- Booking date --></td>
                            <td><!-- Booking time --></td>
                            <td><!-- Current booking status --></td>

                            <td>
                                <form method="POST" action="">
                                    <input
                                        type="hidden"
                                        name="booking_id"
                                        value=""
                                    >

                                    <label for="bookingStatus">Update Status:</label>
                                    <select id="bookingStatus" name="status" required>
                                        <option value="Pending">Pending</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Completed">Completed</option>
                                    </select>

                                    <button type="submit" name="updateStatus">
                                        Save Status
                                    </button>
                                </form>

                                <a href="staff - edit_booking.html?id=">
                                    Move / Reschedule
                                </a>

                                <form method="POST" action="">
                                    <input
                                        type="hidden"
                                        name="booking_id"
                                        value=""
                                    >

                                    <button type="submit" name="cancelBooking">
                                        Cancel Booking
                                    </button>
                                </form>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <footer class="staff-footer">
        <p>&copy; 2026 Splash & Dash. All rights reserved.</p>
    </footer>

</body>
</html>
