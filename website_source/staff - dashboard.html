
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="staff-header">
        <h1>Staff Dashboard</h1>
        <p>Welcome, <span id="staffName"><!-- Backend: Display logged-in staff member's name --></span></p>
    </header>

    <nav class="staff-navbar">
        <a href="staff - service_queue.html">Service Queue</a>
        <a href="login.html">Logout</a>
    </nav>

    <main class="staff-container">

        <section class="staff-overview">
            <h2>Today's Overview</h2>
            <p>View your current workload and completed services.</p>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h2 id="pendingBookings"><!-- Backend: Pending bookings count --></h2>
                    <p>Pending Bookings</p>
                </div>

                <div class="dashboard-card">
                    <h2 id="inProgressBookings"><!-- Backend: In-progress bookings count --></h2>
                    <p>In Progress</p>
                </div>

                <div class="dashboard-card">
                    <h2 id="completedToday"><!-- Backend: Completed bookings today --></h2>
                    <p>Completed Today</p>
                </div>

            </div>
        </section>

        <section class="staff-quick-actions">
            <h2>Quick Actions</h2>

            <div class="dashboard-actions">
                <a href="staff - service_queue.html">
                    View Service Queue
                </a>
            </div>
        </section>

    </main>

    <footer class="staff-footer">
        <p>&copy; 2026 Splash & Dash. All rights reserved.</p>
    </footer>

</body>
</html>
